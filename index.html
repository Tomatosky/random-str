<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>随机字符生成器</title>
    <style>
        * { box-sizing: border-box; }
        :root {
            color-scheme: light;
            font: 15px/1.5 "Inter", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #26332e;
            background: #f5f6f2;
        }
        body { margin: 0; }
        main {
            width: min(636px, calc(100% - 32px));
            margin: clamp(40px, 16vh, 144px) auto;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 0 0 1px #d9dfd8;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 17px 24px;
            border-radius: 10px 10px 0 0;
            background: #34574c;
            color: white;
        }
        h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: .01em; }
        a { color: #e5ede7; font-size: 13px; text-decoration: none; }
        a:hover, .refresh:hover { text-decoration: underline; text-underline-offset: 3px; }
        :focus-visible { outline: 2px solid #406752; outline-offset: 3px; }
        header :focus-visible { outline-color: white; }
        .fields { display: grid; grid-template-columns: 38% 62%; padding-block: 23px; }
        .field { min-width: 0; padding-inline: 24px; }
        .field + .field { border-left: 1px solid #dce2dc; }
        .details { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 10px; }
        label { font-size: 15px; font-weight: 650; }
        .format { color: #69726b; font-size: 12px; }
        input {
            display: block;
            width: 100%;
            margin: 9px 0 17px;
            padding: 0;
            border: 0;
            border-radius: 2px;
            background: transparent;
            color: #1e3028;
            font: 25px/1.4 "IBM Plex Mono", Consolas, Menlo, monospace;
        }
        input::selection { background: #d8e8d9; }
        .actions { display: flex; align-items: center; gap: 7px; }
        button {
            min-height: 34px;
            padding-inline: 12px;
            border: 1px solid transparent;
            border-radius: 5px;
            font: inherit;
            font-size: 13px;
            cursor: pointer;
        }
        .copy { min-width: 68px; border-color: #cbd8ce; background: #e8efe8; color: #2e513e; font-weight: 600; }
        .copy:hover { background: #dce8de; border-color: #b8cabc; }
        .copy[data-copied] { color: white; background: #34574c; border-color: #34574c; }
        .refresh { color: #5d675f; background: transparent; }
        #status { margin: 0; font-size: 13px; color: #575e58; }
        #status:not(:empty) { padding: 0 24px 18px; }
        @media (max-width: 560px) {
            main { margin-top: 40px; }
            header { padding: 15px 20px; }
            h1 { font-size: 20px; }
            .fields { grid-template-columns: 1fr; padding: 0 20px; }
            .field { padding: 18px 0; }
            .field + .field { border-left: 0; border-top: 1px solid #dce2dc; }
            input { margin: 6px 0 10px; font-size: clamp(21px, 5.8vw, 25px); }
            button { min-height: 38px; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>随机字符生成器</h1>
            <a href="https://github.com/Tomatosky/random-str" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a>
        </header>
        <div class="fields">
            <div class="field">
                <div class="details">
                    <label for="user">用户名</label>
                    <span class="format" id="user-format">6 位小写字母</span>
                </div>
                <input id="user" type="text" readonly spellcheck="false" aria-describedby="user-format">
                <div class="actions">
                    <button class="copy" type="button" aria-label="复制用户名">复制</button>
                    <button class="refresh" type="button" aria-label="重新生成用户名">换一个</button>
                </div>
            </div>
            <div class="field">
                <div class="details">
                    <label for="psw">密码</label>
                    <span class="format" id="psw-format">16 位字母与数字</span>
                </div>
                <input id="psw" type="text" readonly spellcheck="false" aria-describedby="psw-format">
                <div class="actions">
                    <button class="copy" type="button" aria-label="复制密码">复制</button>
                    <button class="refresh" type="button" aria-label="重新生成密码">换一个</button>
                </div>
            </div>
        </div>
        <p id="status" role="status"></p>
    </main>
    <script>
        const formats = {
            user: { alphabet: 'abcdefhijkmnprstwxyz', length: 6 },
            psw: { alphabet: 'ABCDEFGHJKMNPQRSTWXYZabcdefhijkmnprstwxyz2345678', length: 16 }
        };

        function generate({ alphabet, length }) {
            const limit = 256 - (256 % alphabet.length);
            const bytes = new Uint8Array(length);
            let result = '';
            while (result.length < length) {
                crypto.getRandomValues(bytes);
                for (const byte of bytes) {
                    if (byte < limit) result += alphabet[byte % alphabet.length];
                    if (result.length === length) break;
                }
            }
            return result;
        }

        async function copyValue(input) {
            if (navigator.clipboard) {
                try {
                    await navigator.clipboard.writeText(input.value);
                    return true;
                } catch {
                    // 本地文件或权限设置可能需要走选区复制。
                }
            }
            input.focus();
            input.select();
            return document.execCommand('copy');
        }

        const status = document.getElementById('status');
        for (const field of document.querySelectorAll('.field')) {
            const input = field.querySelector('input');
            const copy = field.querySelector('.copy');
            const label = field.querySelector('label').textContent;
            let timer;

            function showCopied(copied) {
                clearTimeout(timer);
                copy.toggleAttribute('data-copied', copied);
                copy.textContent = copied ? '已复制' : '复制';
                copy.setAttribute('aria-label', copied ? label + '已复制' : '复制' + label);
            }

            function regenerate() {
                input.value = generate(formats[input.id]);
                showCopied(false);
                status.textContent = '';
            }

            field.querySelector('.refresh').addEventListener('click', regenerate);
            copy.addEventListener('click', async () => {
                const value = input.value;
                const copied = await copyValue(input);
                if (value !== input.value) return;
                showCopied(copied);
                if (copied) {
                    copy.focus({ preventScroll: true });
                    status.textContent = '';
                    timer = setTimeout(() => showCopied(false), 1800);
                } else {
                    status.textContent = label + '已选中，请使用系统的复制操作。';
                }
            });
            regenerate();
        }
    </script>
</body>
</html>
